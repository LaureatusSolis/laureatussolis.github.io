<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Masseria Lamiola Grande</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0ead6;
  --dark:#1e2818;
  --stone:#3a4a2e;
  --gold:#7a9a4a;
  --gold2:#a0bc6a;
  --cream:#f7f2e4;
  --muted:#7a8a6a;
  --card-w:260px;
  --card-h:360px;
  --gap:20px;
  --r:18px;
}

body{background:var(--bg);overflow-x:hidden;font-family:'Jost',sans-serif}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:80px 8vw;
  position:relative;
  background:#1e2818;
}

.hero-bg{
  position:absolute;inset:0;
  background:url('https://picsum.photos/1920/1080?blur=2') center/cover no-repeat;
  opacity:.85;
}

.hero::before{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.35);
}

.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(44px,8vw,100px);
  color:white;
  position:relative;
}

/* CAROUSEL */
.track{
  display:flex;
  gap:var(--gap);
  padding:40px 8vw;
  overflow-x:auto;
  scrollbar-width:none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex:0 0 var(--card-w);
  height:var(--card-h);
  border-radius:18px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateZ(0);
  backface-visibility:hidden;
  transition:.4s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

.card img{
  width:100%;height:100%;
  object-fit:cover;
}

.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
}

.card-body{
  position:absolute;bottom:0;padding:20px;color:white;
}

/* NAV */
.controls{
  display:flex;justify-content:center;gap:10px;margin-bottom:40px;
}

button{
  padding:10px 16px;
  border:none;
  background:var(--gold);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-bg"></div>
  <h1 class="hero-title">Masseria Lamiola Grande</h1>
</section>

<div class="track" id="track">

  <!-- CARD TEMPLATE -->
  <div class="card"><img src="https://picsum.photos/400/600?1"><div class="card-overlay"></div><div class="card-body">Dove ci troviamo</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?2"><div class="card-overlay"></div><div class="card-body">Storia</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?3"><div class="card-overlay"></div><div class="card-body">Territorio</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?4"><div class="card-overlay"></div><div class="card-body">Architettura</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?5"><div class="card-overlay"></div><div class="card-body">Paesaggio</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?6"><div class="card-overlay"></div><div class="card-body">Tradizioni</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?7"><div class="card-overlay"></div><div class="card-body">Video</div></div>
  <div class="card"><img src="https://picsum.photos/400/600?8"><div class="card-overlay"></div><div class="card-body">Galleria</div></div>

</div>

<div class="controls">
  <button onclick="scrollTrack(-1)">←</button>
  <button onclick="scrollTrack(1)">→</button>
</div>

<script>
const track = document.getElementById("track");

function getStep(){
  const card = track.querySelector(".card");
  const gap = 20;
  return card.offsetWidth + gap;
}

function scrollTrack(dir){
  track.scrollBy({
    left: dir * getStep(),
    behavior: "smooth"
  });
}
</script>

</body>
</html>
